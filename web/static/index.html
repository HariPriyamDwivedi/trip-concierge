<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trip Concierge</title>
  <style>
    :root {
      --bg: #f7f7f8; --panel: #fff; --ink: #1c1c22; --muted: #6b6b76;
      --me: #2f6fed; --me-ink: #fff; --bot: #ececf1; --border: #e2e2e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16161a; --panel: #1e1e24; --ink: #ececf1; --muted: #9a9aa6;
        --me: #3b7bff; --me-ink: #fff; --bot: #2a2a32; --border: #2e2e38;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; justify-content: center;
    }
    main { width: 100%; max-width: 680px; height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
    header { padding: 16px 4px 8px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    #log { flex: 1; overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
    .me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .hint { align-self: center; color: var(--muted); font-size: 13px; text-align: center; }
    form { display: flex; gap: 8px; padding: 10px 0 16px; }
    input {
      flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--panel); color: var(--ink); font: inherit;
    }
    button { padding: 0 18px; border: 0; border-radius: 12px; background: var(--me); color: var(--me-ink); font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .attach {
      position: relative; display: flex; align-items: center; padding: 0 12px;
      border: 1px solid var(--border); border-radius: 12px; background: var(--panel); cursor: pointer;
    }
    .attach:focus-within { outline: 2px solid var(--me); outline-offset: 1px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Trip Concierge</h1>
      <p>Ask about where to go, what it costs, or to plan a few days. Attach a booking or notes (.txt, .md, .pdf) to ask about them.</p>
    </header>
    <div id="log">
      <div class="hint">Try: &ldquo;3 nights in Kyoto &mdash; what should I do and what will it cost?&rdquo;</div>
    </div>
    <form id="form">
      <label class="attach" title="Upload a .txt, .md or .pdf file (max 5 MB)">
        <input id="file" type="file" accept=".txt,.md,.pdf" class="sr-only" />
        <span aria-hidden="true">📎</span><span class="sr-only">Upload a file</span>
      </label>
      <input id="input" autocomplete="off" placeholder="Type a message&hellip;" aria-label="Message" />
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const sessionId = "web-" + Math.random().toString(36).slice(2);

    function add(text, who) {
      const el = document.createElement("div");
      el.className = "msg " + who;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add(text, "me");
      input.value = "";
      send.disabled = true;
      const pending = add("…", "bot");
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        const data = await res.json();
        pending.textContent = data.reply || "(no reply)";
      } catch (err) {
        pending.textContent = "Something went wrong. Is the server running?";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    const fileInput = document.getElementById("file");
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const note = add("Uploading " + file.name + "…", "hint");
      const body = new FormData();
      body.append("file", file);
      body.append("session_id", sessionId);
      try {
        const res = await fetch("/upload", { method: "POST", body });
        const data = await res.json();
        const why = typeof data.detail === "string" ? data.detail : "invalid request";
        note.textContent = res.ok
          ? "📎 " + data.filename + " uploaded — ask me about it."
          : "Couldn't upload " + file.name + ": " + why;
      } catch (err) {
        note.textContent = "Upload failed. Is the server running?";
      } finally {
        fileInput.value = "";
        input.focus();
      }
    });
  </script>
</body>
</html>
