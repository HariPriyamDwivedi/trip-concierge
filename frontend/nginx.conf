server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API calls go to the backend service; agent turns can take a while.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 6m;   # uploads are capped at 5 MB by the API
    }

    # OAuth providers redirect here (the URI registered in the Google/Azure apps).
    location = /oauth/callback {
        proxy_pass http://api:8000/api/oauth/callback$is_args$args;
        proxy_set_header Host $host;
    }

    # Hashed build assets can be cached forever; index.html never.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
