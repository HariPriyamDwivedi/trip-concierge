# docker compose up --build   → web chat on http://localhost:8000,
#                                 A2A budget service on http://localhost:8001
x-app: &app
  build: .
  image: trip-concierge
  # GOOGLE_API_KEY etc. come from .env; without it only the no-LLM paths work.
  env_file:
    - path: .env
      required: false

services:
  web:
    <<: *app
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      BUDGET_AGENT_URL: http://budget:8001
    depends_on: [budget]

  budget:
    <<: *app
    command: uvicorn budget_service:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
    environment:
      # Advertise the in-network name so the A2A coordinator can reach it.
      BUDGET_PUBLIC_HOST: budget
